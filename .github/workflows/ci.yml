# Verification CI for Telltale.
#
# This repo is the app on its own — the same source that ships on Google Play,
# with nothing held back. So the checks here are the ones that decide whether a
# build is honest, not a subset kept for show.
#
# Free public runners here are the authoritative remote matrix for
# multiplatform enablement (Android + Apple iOS/macOS + Linux + Windows).
# Compile gates alone are not enough: Apple/Linux/Windows jobs also run a
# Demo/export/transport functional smoke suite after building. The private
# source repo may be Actions-billing-blocked; do not treat private Actions
# green as a merge requirement when this workflow already exercises every
# target platform.
#
# One check is unusual and is the point of the whole file: the `oracle` job runs
# the test suite against an ELM327 simulator that nobody on this project wrote.
# Every other test in this repository is our parser against our simulator, and
# both sides carry the same reading of J1979 — so a misreading agrees with
# itself and goes green. The oracle is the only place that cannot happen.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.yaml requires `sdk: ^3.13.0` and `flutter: ">=3.47.0"`. This pin is
  # mandatory, not stylistic.
  FLUTTER_VERSION: "3.47.0"

jobs:
  app:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # AGP 9.1.0 (android/settings.gradle.kts) needs JDK 17+.
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze

      # `lib/l10n/generated/` is committed, and `flutter test` reads the
      # committed files while the ARB guards read the .arb files. So an edit to
      # an .arb with no regeneration leaves every test green while the built app
      # ships the previous string — a suite agreeing with itself about copy the
      # product does not have, which is the failure mode this repository is
      # organised against.
      #
      # `flutter pub get` above already regenerates, so this only has to notice
      # that it changed something.
      - name: Generated localizations match the ARBs
        run: |
          if ! git diff --exit-code --stat lib/l10n/generated; then
            echo
            echo 'lib/l10n/generated is stale. Run:'
            echo '  flutter gen-l10n && git add lib/l10n/generated'
            exit 1
          fi

      # #47: ARB locales compared without Flutter. A missing key in any shipped
      # locale is a failure; gen-l10n English fallback is not a pass. Every ARB
      # in lib/l10n has to be named here — the checker compares the files it is
      # given, so a shipped locale nobody lists is a locale with no guard at
      # all, and test/tool/test_i18n_verify_ci_guard.py reads the directory to
      # make sure this list keeps up. Fixture tests do not rewrite the shipped
      # ARB files.
      - name: ARB locales have matching keys
        run: |
          set -euo pipefail
          python3 -m py_compile tool/i18n_verify/check_arb.py
          python3 -m unittest discover -s tool/i18n_verify -p 'test_*.py' -v
          python3 tool/i18n_verify/check_arb.py \
            lib/l10n/app_en.arb \
            lib/l10n/app_zh.arb \
            lib/l10n/app_zh_Hant.arb \
            lib/l10n/app_de.arb

      # The three simulator-backed oracle files self-skip here because no
      # simulator is listening. The `oracle` job below exercises the public
      # third-party suite and refuses to pass if any expected test skips; the
      # source repository's CI also runs the additional oracle suites.
      # No count is asserted here on purpose: pinning one turns every added test
      # into a CI failure, which trains people to edit the number rather than
      # read it.
      - run: flutter test

      # Debug signing needs no secrets. Build both identities so the physical
      # adapter app can never accidentally inherit the rig package or label.
      - name: Build and verify Android field/rig identities
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor field
          flutter build apk --debug --flavor rig \
            --dart-define=TELLTALE_TEST_RIG=true

          field_apk=build/app/outputs/flutter-apk/app-field-debug.apk
          rig_apk=build/app/outputs/flutter-apk/app-rig-debug.apk
          test -f "$field_apk"
          test -f "$rig_apk"
          aapt=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -type f -name aapt -perm -111 | sort -V | tail -n 1)
          test -n "$aapt"
          field_badging=$($aapt dump badging "$field_apk")
          rig_badging=$($aapt dump badging "$rig_apk")
          grep -Fq "package: name='com.cbstudio.telltale'" <<< "$field_badging"
          grep -Fq "application-label:'Telltale'" <<< "$field_badging"
          grep -Fq "package: name='com.cbstudio.telltale.rig'" <<< "$rig_badging"
          grep -Fq "application-label:'Telltale Rig'" <<< "$rig_badging"
          if grep -Eiq "com\.cbstudio\.telltale\.rig|Telltale Rig|versionName='[^']*-rig" \
              <<< "$field_badging"; then
            echo "::error::Field APK contains the rig identity"
            exit 1
          fi

      # `RendererPolicy.kt` decides, before the engine starts, whether a phone
      # gets Impeller or is forced to Skia. It is a pure function of three
      # strings and is tested on the JVM here, not on a device. Gradle needs
      # `android/local.properties`, which the build above wrote. The XML report
      # is read back because a test task that ran zero tests also exits 0.
      - name: Renderer policy unit tests (JVM)
        run: |
          set -euo pipefail
          # A previous run's report would satisfy the check below; make the
          # guard true on any machine, not only on a fresh checkout.
          rm -rf build/app/test-results/testFieldDebugUnitTest
          (cd android && ./gradlew --no-daemon -q :app:testFieldDebugUnitTest)
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET, re
          files = sorted(glob.glob('build/app/test-results/testFieldDebugUnitTest/TEST-*.xml'))
          # A suite can appear in the XML with every case skipped. `tests`
          # counts those; only executed cases are a run. Check each required
          # class on its own so one live suite cannot excuse another that
          # skipped everything.
          reports = {}
          failed = 0
          for f in files:
              r = ET.parse(f).getroot()
              name = r.get('name')
              tests = int(r.get('tests', 0))
              skipped = int(r.get('skipped', 0))
              executed = tests - skipped
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
              reports[name] = (executed, skipped, tests)
              print(f"{name}: {tests} tests, {skipped} skipped, {r.get('failures')} failures, {r.get('errors')} errors")
          expected = set()
          for src in glob.glob('android/app/src/test/kotlin/**/*.kt', recursive=True):
              text = open(src, encoding='utf-8').read()
              pkg = re.search(r'^package\s+([\w.]+)', text, re.M)
              for cls in re.findall(r'^class\s+(\w+Test)\b', text, re.M):
                  expected.add(f"{pkg.group(1)}.{cls}" if pkg else cls)
          if not expected:
              print('::error::no test classes found under android/app/src/test'); sys.exit(1)
          if not expected <= set(reports):
              print(f'::error::expected suites did not run: {sorted(expected - set(reports))}'); sys.exit(1)
          for name in sorted(expected):
              executed, skipped, tests = reports[name]
              if executed <= 0:
                  print(f'::error::{name} executed {executed} of {tests}'); sys.exit(1)
              if skipped != 0:
                  print(f'::error::{name} skipped {skipped} of {tests}'); sys.exit(1)
          if failed:
              print(f'::error::{failed} JVM unit test(s) failed'); sys.exit(1)
          EOF

  vehicle-catalogs:
    name: vehicle catalogs — offline updater tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          architecture: x64

      # These checks are deliberately offline. Live official-source freshness
      # checks are a maintainer operation, not a deterministic pull-request gate.
      - name: Compile and test vehicle catalog updaters
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tool/update_us_vehicle_catalog.py \
            tool/update_us_vpic_makes.py \
            tool/update_tw_vehicle_catalog.py \
            tool/update_ca_vehicle_catalog.py \
            tool/oracle_guard/assert_no_skips.py
          python3 -m unittest discover \
            -s test/tool -p 'test_*.py' -v

  powertrain-evidence:
    name: powertrain evidence matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          architecture: x64

      # Research tooling only. The matrix is not a Flutter asset and is not
      # read by app runtime. This job claims .github/workflows/ci.yml for an
      # additive job; it does not change existing jobs.
      - name: Generate, test, and validate the evidence matrix
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tool/powertrain_evidence/generate_matrix.py \
            tool/powertrain_evidence/validate_matrix.py \
            tool/powertrain_evidence/schema.py
          python3 -m unittest discover \
            -s tool/powertrain_evidence -p 'test_*.py' -v
          python3 tool/powertrain_evidence/generate_matrix.py --check
          python3 tool/powertrain_evidence/validate_matrix.py

  apple:
    name: Apple build + functional smoke
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiling is not running. These builds still catch plugins that drop
      # Apple support; the smoke suite below exercises Demo → dashboard and
      # export on the same runner that produced the binaries.
      - name: Build iOS without code signing
        run: flutter build ios --no-codesign

      - name: Build macOS debug
        run: flutter build macos --debug

      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart \
            test/macos_classic_iobluetooth_contract_test.dart \
            test/serial_transport_test.dart \
            test/harness_catalog_test.dart

      # Unsigned desktop archive from the debug tree already built above.
      # Release DMG + notarization need Apple secrets — see tool/packaging/.
      # default-flavor: field → Debug-field (unflavored Debug kept as fallback).
      - name: Package unsigned macOS .app zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(
            build/macos/Build/Products/Debug-field/*.app
            build/macos/Build/Products/Debug/*.app
          )
          test ${#apps[@]} -gt 0
          mkdir -p build/packaging
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" \
            build/packaging/Telltale-macos-debug-unsigned.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-macos-debug-unsigned
          path: build/packaging/Telltale-macos-debug-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build + functional smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # libbluetooth-dev: flutter_classic_bluetooth's Linux CMake hard-requires
          # BlueZ headers at configure time (product Classic path is RFCOMM TTY).
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libbluetooth-dev

      - run: flutter pub get

      - name: Build Linux debug
        run: flutter build linux --debug

      # Widget/unit smoke on the Linux runner after a successful desktop binary.
      # This is not a GTK `flutter run` of the binary, but it is the Demo
      # connect path and export contract the binary embeds.
      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart \
            test/macos_classic_iobluetooth_contract_test.dart \
            test/serial_transport_test.dart \
            test/harness_catalog_test.dart

      - name: Package unsigned Linux debug tarball
        run: |
          set -euo pipefail
          # default-flavor: field → …/field/debug/bundle
          bundle=""
          for candidate in \
            build/linux/x64/field/debug/bundle \
            build/linux/arm64/field/debug/bundle \
            build/linux/x64/debug/bundle \
            build/linux/arm64/debug/bundle
          do
            if [[ -d "$candidate" ]]; then bundle="$candidate"; break; fi
          done
          test -n "$bundle"
          mkdir -p build/packaging
          tar -C "$(dirname "$bundle")" -czf \
            build/packaging/Telltale-linux-debug-unsigned.tar.gz \
            "$(basename "$bundle")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-linux-debug-unsigned
          path: build/packaging/Telltale-linux-debug-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build + functional smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug

      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart \
            test/macos_classic_iobluetooth_contract_test.dart \
            test/serial_transport_test.dart \
            test/harness_catalog_test.dart

      - name: Package unsigned Windows debug zip
        shell: pwsh
        run: |
          # default-flavor: field → …/field/runner/Debug
          $runner = @(
            'build/windows/x64/field/runner/Debug',
            'build/windows/arm64/field/runner/Debug',
            'build/windows/x64/runner/Debug',
            'build/windows/arm64/runner/Debug'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $runner) { throw 'missing Windows Debug runner' }
          New-Item -ItemType Directory -Force -Path build/packaging | Out-Null
          Compress-Archive -Path $runner `
            -DestinationPath build/packaging/Telltale-windows-debug-unsigned.zip `
            -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-windows-debug-unsigned
          path: build/packaging/Telltale-windows-debug-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  privacy:
    name: the two privacy policies agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # There are two copies of the privacy policy and that is the defect.
      # PRIVACY.md is what a reader of this repo sees; docs/privacy.html is the
      # URL registered with Google Play, so it is the authoritative one. They
      # have already drifted once — different "last updated" dates, and the
      # Markdown's English half was missing the children's-data and payment
      # clauses that the served page has. A reader in English was looking at a
      # policy with holes in it.
      #
      # Merging them would mean picking one audience to serve worse. Failing
      # loudly when they disagree costs nothing and catches the same drift.
      - name: Compare sections and dates
        run: |
          python3 - <<'PY'
          import re, sys

          md = open('PRIVACY.md', encoding='utf-8').read()
          html = open('docs/privacy.html', encoding='utf-8').read()

          problems = []

          # 1. Dates. Four of them, and they must all say the same day.
          zh_md = re.search(r'最後更新：(.+)', md)
          en_md = re.search(r'Last updated: (.+)', md)
          zh_html = re.search(r'最後更新：([^<]+)', html)
          en_html = re.search(r'Last updated: ([^<]+)', html)
          if not all([zh_md, en_md, zh_html, en_html]):
              problems.append('a "last updated" line is missing from one of the files')
          else:
              def norm(m):
                  t = m.group(1).strip()
                  # 2026 年 8 月 18 日  ->  2026-8-18 ; 18 August 2026 -> same
                  cjk = re.match(r'(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日', t)
                  if cjk:
                      return tuple(int(g) for g in cjk.groups())
                  months = ['january','february','march','april','may','june','july',
                            'august','september','october','november','december']
                  eng = re.match(r'(\d{1,2}) (\w+) (\d{4})', t)
                  if eng:
                      d, mth, y = eng.groups()
                      return (int(y), months.index(mth.lower()) + 1, int(d))
                  return t
              dates = {norm(zh_md), norm(en_md), norm(zh_html), norm(en_html)}
              if len(dates) != 1:
                  problems.append(f'the four "last updated" dates disagree: {sorted(dates)}')

          # 2. Section lists, per language half. The one-sentence summary is a
          #    lede paragraph in HTML and a heading in Markdown; that is a
          #    formatting choice in each format, not a missing section.
          LEDE = {'一句話版本', 'In one sentence'}

          # The English half begins at its own <h1>. Split on a pattern rather
          # than a literal: the heading gained an `id` when the page grew a
          # language nav, and this check broke on an attribute that changed
          # nothing it looks at. A consistency check that a formatting edit can
          # take offline is one somebody deletes rather than fixes.
          def halves(text, split_on, find):
              parts = re.split(split_on, text, maxsplit=1, flags=re.M)
              assert len(parts) == 2, f'split marker not found: {split_on}'
              zh, en = parts
              return [s for s in find(zh) if s not in LEDE], \
                     [s for s in find(en) if s not in LEDE]

          md_zh, md_en = halves(md, r'^# Telltale Privacy Policy$',
                                lambda t: re.findall(r'^## (.+)$', t, re.M))
          html_zh, html_en = halves(html, r'<h1[^>]*>Telltale Privacy Policy</h1>',
                                    lambda t: re.findall(r'<h2>(.+?)</h2>', t))

          if md_zh != html_zh:
              problems.append(f'Chinese sections differ:\n  PRIVACY.md   {md_zh}\n  privacy.html {html_zh}')
          if md_en != html_en:
              problems.append(f'English sections differ:\n  PRIVACY.md   {md_en}\n  privacy.html {html_en}')
          if len(md_zh) != len(md_en):
              problems.append(f'PRIVACY.md halves are not the same policy:\n  zh {md_zh}\n  en {md_en}')
          if len(html_zh) != len(html_en):
              problems.append(f'privacy.html halves are not the same policy:\n  zh {html_zh}\n  en {html_en}')

          # 3. Shape, per section, between the two language halves of the served
          #    page. Section lists alone cannot see the failure that actually
          #    happened: both halves had a heading called "What we collect", and
          #    under it the Chinese made three promises — no personal data, none
          #    sent to us OR to third parties, no servers — while the English
          #    made one. The Chinese "what is stored" section was a five-row
          #    table with a justification per row; the English was a single
          #    sentence with no reasons. Every heading matched, so this job was
          #    green while an English-speaking reader saw a weaker policy.
          #
          #    Prose cannot be compared across languages, but shape can, and
          #    shape is what went wrong: a table on one side and a paragraph on
          #    the other is a section that does not say the same thing twice.
          def shape(section_html):
              return (
                  section_html.count('<table'),
                  section_html.count('<tr'),
                  section_html.count('<li'),
              )

          def sections_with_bodies(text):
              parts = re.split(r'<h2>(.+?)</h2>', text)
              out = {}
              for i in range(1, len(parts), 2):
                  out[parts[i]] = parts[i + 1]
              return out

          html_zh_body, html_en_body = re.split(
              r'<h1[^>]*>Telltale Privacy Policy</h1>', html, maxsplit=1)
          assert html_en_body, 'the English half of docs/privacy.html is empty'
          zh_bodies = sections_with_bodies(html_zh_body)
          en_bodies = sections_with_bodies(html_en_body)
          for zh_name, en_name in zip(html_zh, html_en):
              zs, es = shape(zh_bodies.get(zh_name, '')), shape(en_bodies.get(en_name, ''))
              if zs != es:
                  problems.append(
                      f'"{zh_name}" and "{en_name}" are shaped differently: '
                      f'zh has {zs[0]} table(s)/{zs[1]} row(s)/{zs[2]} list item(s), '
                      f'en has {es[0]}/{es[1]}/{es[2]}. One language is being told less.'
                  )

          if problems:
              print('The two privacy policies have drifted. docs/privacy.html is the')
              print('authoritative one — it is the URL Google Play holds.\n')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          print(f'OK: {len(md_zh)} sections, identical across both files and both languages.')
          PY

      # The site is two files now, one per language, and the pair only works if
      # each one can reach the other. A visitor who lands on the English page
      # from a search result and cannot find their way to the Chinese one is
      # worse off than they were with the single bilingual page.
      #
      # The privacy policy deliberately did NOT split: Google Play registers one
      # URL and fetches it, so narrowing that document to one language would
      # leave readers of the other with a policy they cannot read. It stays one
      # bilingual document with an anchor per language, and this checks the
      # anchors the split pages link into.
      - name: The two site pages point at each other
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          problems = []
          policy_path = pathlib.Path('docs/privacy.html')
          policy = policy_path.read_text(encoding='utf-8')

          pages = {
              'docs/index.html': ('zh-Hant', 'index.en.html', 'zh'),
              'docs/index.en.html': ('en', 'index.html', 'en'),
          }
          for path, (lang, sibling, anchor) in pages.items():
              f = pathlib.Path(path)
              if not f.exists():
                  problems.append(f'{path} is missing')
                  continue
              text = f.read_text(encoding='utf-8')
              declared = re.search(r'<html lang="([^"]+)"', text)
              found = declared.group(1) if declared else 'nothing'
              if found != lang:
                  problems.append(f'{path} declares lang={found}, expected {lang}')
              if f'href="{sibling}"' not in text:
                  problems.append(f'{path} does not link {sibling}')
              if f'privacy.html#{anchor}' not in text:
                  problems.append(
                      f'{path} does not link privacy.html#{anchor}. A reader '
                      'sent to the policy without an anchor lands at the top '
                      'of a long document in the other language.')

          # Every anchor any file in the repo links into the policy has to
          # exist. Checking the two ends separately — "the pages link the
          # policy" and "the policy has ids" — passed a page pointing at
          # `privacy.html#zh-TW`, which is nowhere. A reviewer found that, and
          # it is precisely the failure the anchors were added to prevent.
          linked = set()
          for f in list(pathlib.Path('docs').rglob('*.html')) + [
              pathlib.Path('README.md'), pathlib.Path('README.zh-TW.md')]:
              if not f.exists():
                  continue
              for m in re.finditer(r'privacy\.html#([A-Za-z0-9_-]+)',
                                   f.read_text(encoding='utf-8')):
                  linked.add((str(f), m.group(1)))
          for source, anchor in sorted(linked):
              if f'id="{anchor}"' not in policy:
                  problems.append(
                      f'{source} links privacy.html#{anchor}, which the policy '
                      'does not define')
          for anchor in ['zh', 'en']:
              if f'id="{anchor}"' not in policy:
                  problems.append(f'docs/privacy.html lost id="{anchor}", so a '
                                  'language link into it lands at the top')

          # The two READMEs are mirrored from the private repo's `app/`, and
          # `docs/` is not — so a sync in that direction reverts an edit here
          # while leaving the site untouched. Losing an anchor is silent to the
          # loop above, which only checks that anchors which ARE present exist.
          # This makes it loud, and it is the shape most likely to happen: a
          # `--delete` mirror putting back a `privacy.html` with no fragment.
          for readme, anchor in [('README.md', 'en'),
                                 ('README.zh-TW.md', 'zh')]:
              f = pathlib.Path(readme)
              if not f.exists():
                  problems.append(f'{readme} is missing')
                  continue
              if f'privacy.html#{anchor}' not in f.read_text(encoding='utf-8'):
                  problems.append(
                      f'{readme} does not link privacy.html#{anchor}. If a '
                      'mirror from the private repo reverted it, the same edit '
                      'has to land in torque:app/ as well.')

          if problems:
              print('The site pages do not line up:')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          print('OK: both site pages declare their language, link each other, '
                'and reach the policy.')
          PY

  store-assets:
    name: each README shows its own language's screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two READMEs hotlink screenshots through raw.githubusercontent.com,
      # so nothing local resolves them and nothing local breaks when they rot.
      # A reader gets a broken image on the repo front page and we hear about it
      # from them.
      #
      # Since 1.0.11 there are two sets of screenshots, one per listing
      # language, and the interesting failure is not a missing file — it is the
      # English README showing the Chinese screenshots after a copy-paste. That
      # would render perfectly and quietly tell every English reader the app has
      # no English interface, which is the exact claim the screenshots exist to
      # make. So this checks the locale, not just the path.
      - name: Resolve every hotlinked asset
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          PREFIX = 'https://raw.githubusercontent.com/ImL1s/telltale/main/'
          # Which README is allowed to show which locale's assets. Assets with
          # no text in them (the icon, the video) are shared and listed as None.
          expected = {'README.md': 'en-US', 'README.zh-TW.md': 'zh-TW'}

          problems = []
          seen = 0

          for name, locale in expected.items():
              text = pathlib.Path(name).read_text(encoding='utf-8')
              for url in re.findall(re.escape(PREFIX) + r'([^\s")\]]+)', text):
                  seen += 1
                  path = pathlib.Path(url)
                  if not path.exists():
                      problems.append(f'{name}: {url} does not exist in the repo')
                      continue
                  if url.startswith('store/'):
                      parts = url.split('/')
                      # store/<locale>/<file> for anything with words in it.
                      if len(parts) == 3 and parts[1] in expected.values():
                          if parts[1] != locale:
                              problems.append(
                                  f'{name} shows {parts[1]} assets; it must show {locale}. '
                                  'A reader would take the screenshots as proof the app '
                                  'does not speak their language.')
                      elif len(parts) != 2:
                          problems.append(f'{name}: {url} is not store/<locale>/<file> '
                                          'nor a shared store/<file>')

          # Both locales must actually be complete, or one listing ships short.
          for locale in expected.values():
              for shot in ['01-connect', '02-dashboard', '03-dtc-freeze',
                           '05-performance', '06-skins', 'feature-1024x500']:
                  f = pathlib.Path(f'store/{locale}/{shot}.png')
                  if not f.exists():
                      problems.append(f'{f} is missing; the {locale} listing cannot be built')

          if problems:
              print('Store assets do not line up:')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          print(f'OK: {seen} hotlinks resolve, and each README shows its own locale.')
          PY

      # Play enforces these at upload time, which is the worst moment to learn:
      # half the locales are already written and the rest are not. The counts
      # are characters, not bytes — a Chinese description is a third the bytes
      # of an English one at the same limit, and getting that wrong would either
      # reject valid copy or wave through copy Play will refuse.
      - name: Listing copy fits Play's limits
        run: |
          python3 - <<'PY'
          import pathlib, sys

          LIMITS = {
              'title.txt': 30,
              'short_description.txt': 80,
              'full_description.txt': 4000,
          }
          CHANGELOG_LIMIT = 500

          problems = []
          locales = sorted(p.name for p in pathlib.Path('store/metadata').iterdir() if p.is_dir())
          if not locales:
              problems.append('store/metadata has no locales')

          for locale in locales:
              root = pathlib.Path('store/metadata') / locale
              for name, limit in LIMITS.items():
                  f = root / name
                  if not f.exists():
                      problems.append(f'{f} is missing')
                      continue
                  n = len(f.read_text(encoding='utf-8').rstrip('\n'))
                  if n > limit:
                      problems.append(f'{f}: {n} characters, limit {limit}')
                  if n == 0:
                      problems.append(f'{f} is empty; Play would reject the listing')
              for f in sorted((root / 'changelogs').glob('*.txt')):
                  n = len(f.read_text(encoding='utf-8').rstrip('\n'))
                  if n > CHANGELOG_LIMIT:
                      problems.append(f'{f}: {n} characters, limit {CHANGELOG_LIMIT}')

          # Every locale must carry release notes for the same versionCodes, or
          # one language silently ships last release's notes.
          notes = {loc: {f.stem for f in (pathlib.Path('store/metadata') / loc / 'changelogs').glob('*.txt')}
                   for loc in locales}
          if notes and len(set(map(frozenset, notes.values()))) != 1:
              problems.append('locales carry release notes for different versionCodes: '
                              + '; '.join(f'{k}={sorted(v)}' for k, v in notes.items()))

          if problems:
              print('Listing copy will not upload:')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          print(f'OK: {len(locales)} locales within every Play limit, matching release notes.')
          PY

  rigs:
    name: test rigs — framing and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          architecture: x64

      - name: Syntax checks
        run: |
          python3 -m py_compile \
            tool/ble_test_rig/emulator_entrypoint.py \
            tool/ble_test_rig/bridge.py \
            tool/ble_test_rig/process_identity.py \
            tool/ble_test_rig/probe.py \
            tool/ble_test_rig/test_bridge.py \
            tool/ble_test_rig/test_emulator_entrypoint.py \
            tool/ble_test_rig/test_probe.py \
            tool/ble_test_rig/test_process_identity.py \
            tool/ble_test_rig/test_run_controller.py \
            tool/obd_test_rig/chaos_proxy.py \
            tool/obd_test_rig/test_chaos_proxy.py \
            tool/obd_test_rig/freeze_frame_reference.py \
            tool/obd_test_rig/test_freeze_frame_reference.py \
            tool/workshop/assert_chaos_jsonl.py \
            tool/workshop/assert_official_reporter.py \
            tool/workshop/assert_skip_manifest.py \
            tool/workshop/count_dart_tests.py \
            tool/workshop/test_workshop.py \
            tool/field_bt_verify/probe_acl.py \
            tool/field_bt_verify/run_timeout.py \
            tool/field_bt_verify/test_probe_acl.py \
            tool/field_bt_verify/test_runner_contract.py \
            tool/field_bt_verify/test_run_timeout.py \
            tool/desktop_bt_probe/probe.py \
            tool/desktop_bt_probe/test_probe.py

      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          {
            python3 -m unittest discover \
              -s tool/ble_test_rig -p 'test_*.py' -v
            python3 -m unittest discover \
              -s tool/obd_test_rig -p 'test_*.py' -v
            python3 -m unittest discover \
              -s tool/field_bt_verify -p 'test_*.py' -v
            python3 -m unittest discover \
              -s tool/desktop_bt_probe -p 'test_*.py' -v
            python3 -m unittest discover \
              -s tool/workshop -p 'test_*.py' -v
          } 2>&1 | tee "$RUNNER_TEMP/rig-unittests.txt"
          python3 tool/workshop/assert_skip_manifest.py \
            --unittest-output "$RUNNER_TEMP/rig-unittests.txt"

  oracle:
    name: public oracles — Ircama, chaos, freeze-frame
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The lockfile's hashes name cp314 wheels, so the interpreter is part
          # of the pin — a runner's default python3 is not 3.14.
          python-version: "3.14.4"
          architecture: x64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Without this guard the job is decoration. A skipped test prints a
      # summary indistinguishable from a passing one and `flutter test` exits 0
      # either way — so an oracle that never reached the simulator would report
      # exactly the same green as one that passed. The parser lives in-tree so
      # it can be unit-tested; the Flutter exit code must not be discarded.
      - name: Check the skip guard is in the tree
        run: |
          test -f tool/oracle_guard/assert_no_skips.py
          test -f tool/workshop/run_public_oracles.sh
          test -f tool/workshop/count_dart_tests.py

      - name: Install hash-pinned Ircama
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/elmvenv"
          # ELM327-emulator's build backend still imports pkg_resources, which
          # setuptools 82 removed (measured 2026-08-20: 81.0.0 still has it), so
          # a plain `pip install ELM327-emulator` exits 1 with
          # `ModuleNotFoundError: No module named 'pkg_resources'`.
          #
          # Both installs are hash-pinned. This job fetches and runs code from
          # PyPI on every push, and the whole point of the oracle is that it is
          # a fixed second opinion — a range would let a yanked-and-replaced
          # release quietly change what the app is being checked against.
          "$RUNNER_TEMP/elmvenv/bin/pip" install --quiet --require-hashes \
            --requirement "$GITHUB_WORKSPACE/.github/requirements/elm327-build.lock"
          # Upstream rewrites its own version string when GITHUB_RUN_NUMBER is
          # set, so inside Actions the reviewed sdist stops calling itself 3.0.5.
          env -u GITHUB_RUN_NUMBER "$RUNNER_TEMP/elmvenv/bin/pip" install --quiet \
            --no-build-isolation --require-hashes \
            --requirement "$GITHUB_WORKSPACE/.github/requirements/elm327-py314-linux-x86_64.lock"
          test "$("$RUNNER_TEMP/elmvenv/bin/python" -c \
            'import importlib.metadata as m; print(m.version("ELM327-emulator"))')" = "3.0.5"
          "$RUNNER_TEMP/elmvenv/bin/pip" check

      - name: Ircama ELM327-emulator
        env:
          ELM_PYTHON: ${{ runner.temp }}/elmvenv/bin/python
          PUBLIC_ORACLE_STATE: ${{ runner.temp }}/public-oracles
          FLUTTER: flutter
        run: |
          set -euo pipefail
          bash tool/workshop/run_public_oracles.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oracle-public-evidence
          path: ${{ runner.temp }}/public-oracles/
          if-no-files-found: warn
          retention-days: 14

      - name: Oracle logs on failure
        if: failure()
        run: |
          tail -80 "${RUNNER_TEMP}/public-oracles/elm/elm.log" 2>/dev/null || true
          tail -40 "${RUNNER_TEMP}/public-oracles/proxy.stderr" 2>/dev/null || true
          tail -40 "${RUNNER_TEMP}/public-oracles/freeze.stderr" 2>/dev/null || true
