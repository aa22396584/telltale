# Publishes a signed APK to GitHub Releases.
#
# The README's first promise is that you can build this yourself and use it.
# That promise is thin if the only ready-made binary costs money, so this
# workflow exists to hand a working APK to people who cannot or will not run a
# Flutter toolchain. The Play listing buys convenience and supports the work; it
# does not buy features, and nothing here is held back from this build.
#
# THE KEY USED HERE IS NOT THE GOOGLE PLAY UPLOAD KEY, and must never be.
# Two separate signing lineages, deliberately:
#
#   Google Play   CN=Torque OBD2 ...          never leaves the maintainer's machine
#   GitHub        CN=Telltale Community Build lives in this repo's Actions secrets
#
# The consequence is real and worth stating plainly in the release notes: an APK
# from here cannot update a Play install, and a Play update cannot replace an APK
# from here. Android will refuse with a signature mismatch. That is the correct
# behaviour — if the two shared a key, anything that compromised CI could publish
# a replacement for a store install.
#
# A tag carrying a SemVer pre-release suffix (v1.0.1-beta.1) is published as a
# GitHub pre-release. The flag means exactly one thing, and it is a thing one
# person can settle in an afternoon:
#
#   pre-release  =  this tag neither requires nor attests a device walk
#   full release =  docs/verification/device-verification.md carries the line
#                   `Device walk attested: <version>` for this version
#
# CI enforces it rather than trusting the tag: tool/release/require_device_walk.sh
# refuses a full-release tag without that line, before it builds anything. The
# flag used to be derived from the tag string alone and validated nothing, so
# "walked" was true only when whoever cut the tag happened to have done it.
#
# Two things the full release does NOT claim, and says so in its own notes.
# It attests the VERSION, not the commit -- nothing checks that the code walked
# is byte-for-byte the code tagged. And the walked build is not the published
# APK: the walk runs on a locally signed build, this workflow signs with the
# community key.
#
# It used to mean something else, and that is why every release from v1.0.7 to
# v1.0.11 was a pre-release and GitHub's Latest badge sat on v1.0.6 for nine
# days while the same commit shipped to Play production at 100%. The flag was
# carrying "never run against a real car" as well, and the evidence paragraph
# was printed only when it was set -- so publishing a release people could find
# meant deleting the honest paragraph. Nobody was going to do that, so nobody
# published one.
#
# A gate a maintainer cannot pass is not a standard, it is a stall. The things
# one person cannot do -- a second adapter, another vehicle, any engine-running
# condition -- do not block a release and never should have. They are stated,
# on every release, in the boundary section below, which now prints whether or
# not the flag is set. The flag gates what the maintainer controls; the prose
# states what they do not.
#
# The rule lives here rather than in a person's memory, because the one release
# where somebody forgets to tick the box is the one where the claim matters.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (must already exist)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  FLUTTER_VERSION: "3.47.0"
  # Reviewed community-signing lineage from v1.0.3-beta.1. Comparing only the
  # APK with the secret keystore would let an accidentally uploaded Play,
  # debug, or rotated key validate itself.
  COMMUNITY_CERT_SHA256: "7e97b3dd0b3f11a9a593cf8d182d49032490022938cecaafde90b53d5825414d"

jobs:
  apk:
    name: signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve and validate the release tag
        id: release_tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag must be vX.Y.Z or vX.Y.Z-prerelease; got $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An exact tag ref prevents a same-named branch from winning checkout
          # during workflow_dispatch.
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify tag, main head, and app version agree
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          tag_version_name=${BASH_REMATCH[1]}
          pub_version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          version_name=${pub_version%%+*}
          version_code=${pub_version##*+}
          if [ -z "$pub_version" ] || [ "$version_name" = "$pub_version" ] ||
             ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml must contain version: X.Y.Z+N"
            exit 1
          fi
          if [ "$tag_version_name" != "$version_name" ]; then
            echo "::error::Tag $TAG does not match pubspec versionName $version_name"
            exit 1
          fi

          tag_ref="refs/tags/$TAG"
          git show-ref --verify --quiet "$tag_ref"
          tag_commit=$(git rev-list -n 1 "$tag_ref")
          head_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          main_commit=$(git rev-parse refs/remotes/origin/main)
          if [ "$head_commit" != "$tag_commit" ] || [ "$head_commit" != "$main_commit" ]; then
            echo "::error::Release tag must peel to the current main head"
            echo "tag=$tag_commit checkout=$head_commit main=$main_commit"
            exit 1
          fi

          printf 'APP_VERSION=%s\nAPP_VERSION_NAME=%s\nAPP_VERSION_CODE=%s\nCOMMIT_SHA=%s\n' \
            "$pub_version" "$version_name" "$version_code" "$head_commit" \
            >> "$GITHUB_ENV"

      - name: Require a recorded device walk for a full release
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: bash tool/release/require_device_walk.sh "$TAG"

      - name: Require successful exact-head main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$COMMIT_SHA" \
            -f per_page=100)
          run_url=$(jq -r --arg sha "$COMMIT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | first | .html_url // empty' \
            <<< "$runs")
          if [ -z "$run_url" ]; then
            echo "::error::No successful main CI push run exists for $COMMIT_SHA"
            exit 1
          fi
          echo "exact-head CI: $run_url"

      - run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      # Nothing is published from a tree that has not passed. A release build is
      # the one artifact where "the tests were probably fine" is not good enough,
      # because it is the only one that reaches somebody else's car.
      - run: flutter analyze
      - run: flutter test

      - name: Restore the community signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.COMMUNITY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::COMMUNITY_KEYSTORE_BASE64 is not set. Without it this"
            echo "::error::job would fall back to debug signing, and a debug-signed"
            echo "::error::APK published as a release is indistinguishable from the"
            echo "::error::real thing once it leaves the runner. Refusing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/community.jks
          # Absolute path on purpose. `key.properties` is read from the Android
          # rootProject (android/), but `storeFile` is resolved by `file()`
          # inside android/app/build.gradle.kts, which is a *subproject* — so a
          # relative path is interpreted against android/app/, not android/.
          # An absolute path cannot be read the wrong way by either.
          cat > android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/android/community.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEYSTORE_PASSWORD}
          EOF
          chmod 600 android/key.properties android/community.jks
          # Prove the key really loaded before spending a build on it: an
          # unreadable keystore fails much later and much less legibly.
          keytool -list -keystore android/community.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          key_fingerprint=$(keytool -list -v -keystore android/community.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/ { gsub(":", "", $2); print tolower($2); exit }')
          if [ "$key_fingerprint" != "$COMMUNITY_CERT_SHA256" ]; then
            echo "::error::The restored keystore is not the reviewed community key"
            echo "expected=$COMMUNITY_CERT_SHA256 actual=${key_fingerprint:-missing}"
            exit 1
          fi
          echo "reviewed community signing key loaded"

      # One universal APK rather than per-ABI splits. Splits are a third the
      # size, but they also mean a person sideloading has to know which of four
      # files matches their phone, and picking wrong gives an install error with
      # no explanation. One file that always works is the right default for an
      # audience that is here because they did not want to build it themselves.
      - run: flutter build apk --release --flavor field

      - name: Describe what was built
        id: describe
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-field-release.apk
          test -f "$APK"

          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          test -n "$sdk_root"
          AAPT=$(find "$sdk_root/build-tools" -type f -name aapt -perm -111 \
            | sort -V | tail -n 1)
          APKSIGNER=$(find "$sdk_root/build-tools" -type f -name apksigner -perm -111 \
            | sort -V | tail -n 1)
          if [ -z "$AAPT" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Android build tools do not contain executable aapt and apksigner"
            exit 1
          fi
          echo "aapt=$AAPT"
          echo "apksigner=$APKSIGNER"
          echo "build-tools=$(basename "$(dirname "$APKSIGNER")")"

          badging=$($AAPT dump badging "$APK")
          package_line=$(grep -m 1 '^package:' <<< "$badging" || true)
          label_line=$(grep -m 1 '^application-label:' <<< "$badging" || true)
          expected_package="package: name='com.cbstudio.telltale' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'"
          if [[ "$package_line" != "$expected_package"* ]]; then
            echo "::error::Field APK package/version metadata is wrong"
            echo "expected-prefix=$expected_package"
            echo "actual=${package_line:-missing}"
            exit 1
          fi
          if [ "$label_line" != "application-label:'Telltale'" ]; then
            echo "::error::Field APK application label is wrong"
            echo "actual=${label_line:-missing}"
            exit 1
          fi
          if grep -Eiq "com\.cbstudio\.telltale\.rig|Telltale Rig|versionName='[^']*-rig" \
              <<< "$badging"; then
            echo "::error::A rig identity reached the field release path"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-certs.txt
          # Build Tools 36 prints `Signer #1 certificate ...`; Build Tools 37
          # prints `V2 Signer: certificate ...`. The digest is the final field
          # in both formats, so do not couple release integrity to the prefix.
          apk_fingerprint=$(awk \
            'tolower($0) ~ /certificate sha-256 digest:/ { print tolower($NF); exit }' \
            apk-certs.txt | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')
          key_fingerprint=$(keytool -list -v -keystore android/community.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F':' '/SHA256:/ { for (i = 2; i <= NF; i++) printf "%s", $i; exit }' \
            | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')
          if ! [[ "$apk_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not parse the APK SHA-256 signing certificate digest"
            grep -i 'certificate SHA-256 digest' apk-certs.txt || true
            exit 1
          fi
          if ! [[ "$key_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not parse the keystore SHA-256 certificate digest"
            echo "keystore=${key_fingerprint:-missing}"
            exit 1
          fi
          if [ "$apk_fingerprint" != "$key_fingerprint" ]; then
            echo "::error::APK certificate does not match the restored community keystore"
            echo "apk=$apk_fingerprint keystore=$key_fingerprint"
            exit 1
          fi
          if [ "$apk_fingerprint" != "$COMMUNITY_CERT_SHA256" ]; then
            echo "::error::APK certificate is not the reviewed community lineage"
            echo "expected=$COMMUNITY_CERT_SHA256 actual=$apk_fingerprint"
            exit 1
          fi

          {
            echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "size=$(du -h "$APK" | cut -f1)"
            echo "fingerprint=$apk_fingerprint"
            echo "version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          APP_VERSION: ${{ steps.describe.outputs.version }}
          APK_SIZE: ${{ steps.describe.outputs.size }}
          APK_SHA256: ${{ steps.describe.outputs.sha256 }}
          APK_FINGERPRINT: ${{ steps.describe.outputs.fingerprint }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-field-release.apk \
             "telltale-${TAG}.apk"
          sha256sum "telltale-${TAG}.apk" > SHA256SUMS

          # The flag and the paragraph that explains it come from one reading of
          # one tag, inside a script test/release_notes_contract_test.dart
          # executes. Deriving the flag a second time here is how they came to
          # disagree: the notes claimed a walk the flag did not gate on.
          bash tool/release/release_notes.sh notes > notes.md

          # Assigned on its own line, then matched exhaustively. Inlined as
          # `if [ "$(... flag)" = prerelease ]` this fails OPEN: a condition is
          # exempt from set -e, `[` discards the substitution's exit status, and
          # a crashed script compares empty against "prerelease" -- publishing a
          # full release, which is the one direction that must never happen by
          # accident.
          release_flag=$(bash tool/release/release_notes.sh flag)
          release_args=()
          case "$release_flag" in
            prerelease) release_args+=(--prerelease) ;;
            full) ;;
            *) echo "::error::Unexpected release flag: '$release_flag'"; exit 1 ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published assets are immutable by policy"
            exit 1
          fi

          gh release create "$TAG" "telltale-${TAG}.apk" SHA256SUMS \
            --title "Telltale ${TAG}" \
            --notes-file notes.md \
            --verify-tag ${release_args[@]+"${release_args[@]}"}

      - name: Shred the signing material
        if: always()
        run: rm -f android/key.properties android/community.jks
